apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-intelligence
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-intelligence
  template:
    metadata:
      labels:
        app: alert-intelligence
    spec:
      containers:
        - name: alert-intelligence
          image: alert-intelligence:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: alert-intelligence
  namespace: monitoring
spec:
  selector:
    app: alert-intelligence
  ports:
    - port: 8000
      targetPort: 8000
