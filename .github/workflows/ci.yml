name: CI

# Runs on every push to main, and on every pull request targeting main.
# This is what puts a green/red checkmark next to commits on GitHub.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests/ -v

  docker-build:
    name: Verify Docker build
    runs-on: ubuntu-latest
    # Only build the image if tests passed - no point building a broken app.
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t alert-intelligence:ci-check .